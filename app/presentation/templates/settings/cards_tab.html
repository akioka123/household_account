<div>
    <h3 class="text-lg font-semibold mb-4">カード管理</h3>
    
    <!-- カード追加フォーム -->
    <form 
        hx-post="/settings/cards"
        hx-target="#cards-list"
        hx-swap="outerHTML"
        class="mb-6"
    >
        <div class="flex space-x-2">
            <input 
                type="text" 
                name="name" 
                placeholder="カード名" 
                required
                class="flex-1 border border-gray-300 rounded-md px-3 py-2"
            >
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                追加
            </button>
        </div>
    </form>
    
    <!-- カード一覧 -->
    <div id="cards-list">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">カード名</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ステータス</th>
                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">操作</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                {% for card in cards %}
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ card.name }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        {% if card.enabled %}
                            <span class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">有効</span>
                        {% else %}
                            <span class="px-2 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-800">無効</span>
                        {% endif %}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-center text-sm">
                        <button 
                            class="text-blue-600 hover:text-blue-800"
                            hx-post="/settings/cards/{{ card.id }}/toggle"
                            hx-target="#cards-list"
                            hx-swap="outerHTML"
                        >
                            {% if card.enabled %}無効化{% else %}有効化{% endif %}
                        </button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="px-6 py-4 text-center text-sm text-gray-500">カードが登録されていません</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
