<div>
    <h3 class="text-lg font-semibold mb-4">上限設定</h3>
    
    <form 
        hx-post="/settings/limits"
        hx-target="#limits-content"
        hx-swap="innerHTML"
    >
        <div class="space-y-4">
            <div>
                <label for="max_variable_items" class="block text-sm font-medium text-gray-700 mb-1">
                    変動費最大件数
                </label>
                <input 
                    type="number" 
                    id="max_variable_items" 
                    name="max_variable_items" 
                    value="{{ settings.max_variable_items }}"
                    min="1"
                    required
                    class="w-full border border-gray-300 rounded-md px-3 py-2"
                >
            </div>
            
            <div>
                <label for="max_fixed_items" class="block text-sm font-medium text-gray-700 mb-1">
                    固定費最大件数
                </label>
                <input 
                    type="number" 
                    id="max_fixed_items" 
                    name="max_fixed_items" 
                    value="{{ settings.max_fixed_items }}"
                    min="1"
                    required
                    class="w-full border border-gray-300 rounded-md px-3 py-2"
                >
            </div>
            
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                保存
            </button>
        </div>
    </form>
    
    <div id="limits-content"></div>
</div>
