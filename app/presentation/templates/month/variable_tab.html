<div id="variable-expenses-content">
    <h3 class="text-lg font-semibold mb-4">変動費（カード請求）</h3>
    
    <!-- カードデータをJSONとして埋め込む（JavaScriptで使用） -->
    <script type="application/json" id="cards-data">
    [
        {% for card in cards %}
        {% if card.enabled %}
        {"id": {{ card.id }}, "name": "{{ card.name|e }}"}{% if not loop.last %},{% endif %}
        {% endif %}
        {% endfor %}
    ]
    </script>
    
    <form 
        id="variable-expenses-form"
        hx-post="/month/{{ year }}/{{ month }}/card-statements"
        hx-target="#variable-expenses-content"
        hx-swap="outerHTML"
        class="space-y-4"
    >
        <div id="variable-expenses-rows" class="space-y-3">
            {% if statements %}
                {% for statement in statements %}
                <div class="variable-expense-row flex items-center space-x-3 p-3 bg-gray-50 rounded-lg">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">カード</label>
                        <select 
                            name="card_id_{{ loop.index0 }}" 
                            required
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                        >
                            <option value="">選択してください</option>
                            {% for card in cards %}
                            {% if card.enabled %}
                            <option value="{{ card.id }}" {% if card.id == statement.card_id %}selected{% endif %}>
                                {{ card.name }}
                            </option>
                            {% endif %}
                            {% endfor %}
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">請求総額</label>
                        <input 
                            type="number" 
                            name="amount_{{ loop.index0 }}" 
                            value="{{ statement.amount.amount }}"
                            min="0"
                            required
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                        >
                    </div>
                    <div class="pt-6">
                        <button 
                            type="button" 
                            class="remove-row-btn text-red-600 hover:text-red-800 px-3 py-2"
                            onclick="this.closest('.variable-expense-row').remove()"
                        >
                            削除
                        </button>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <!-- 初期行 -->
                <div class="variable-expense-row flex items-center space-x-3 p-3 bg-gray-50 rounded-lg">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">カード</label>
                        <select 
                            name="card_id_0" 
                            required
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                        >
                            <option value="">選択してください</option>
                            {% for card in cards %}
                            {% if card.enabled %}
                            <option value="{{ card.id }}">{{ card.name }}</option>
                            {% endif %}
                            {% endfor %}
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">請求総額</label>
                        <input 
                            type="number" 
                            name="amount_0" 
                            min="0"
                            required
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                        >
                    </div>
                    <div class="pt-6">
                        <button 
                            type="button" 
                            class="remove-row-btn text-red-600 hover:text-red-800 px-3 py-2"
                            onclick="this.closest('.variable-expense-row').remove()"
                        >
                            削除
                        </button>
                    </div>
                </div>
            {% endif %}
        </div>
        
        <div class="flex justify-between">
            <button 
                type="button" 
                id="add-row-btn"
                class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300"
            >
                行を追加
            </button>
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                保存
            </button>
        </div>
    </form>
    
    <div id="variable-expenses-result" class="mt-6">
        {% if statements %}
        <div class="bg-green-50 rounded-lg p-4">
            <p class="text-sm text-green-800">
                <strong>合計:</strong> {{ "{:,}".format(statements|sum(attribute='amount.amount')) }}円
            </p>
        </div>
        {% endif %}
    </div>
</div>
