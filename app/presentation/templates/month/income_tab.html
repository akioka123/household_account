<div>
    <h3 class="text-lg font-semibold mb-4">収入</h3>
    
    <form 
        hx-post="/month/{{ year }}/{{ month }}/income"
        hx-target="#income-content"
        hx-swap="outerHTML"
        class="space-y-4"
    >
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 月例給与 -->
            <div class="bg-gray-50 p-4 rounded-lg">
                <h4 class="font-medium mb-3 text-gray-700">月例給与</h4>
                <div class="space-y-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">額面</label>
                        <input 
                            type="number" 
                            name="salary_gross" 
                            value="{% if income %}{{ income.salary_gross.amount }}{% else %}0{% endif %}"
                            min="0"
                            required
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                        >
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">手取り</label>
                        <input 
                            type="number" 
                            name="salary_net" 
                            value="{% if income %}{{ income.salary_net.amount }}{% else %}0{% endif %}"
                            min="0"
                            required
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                        >
                    </div>
                </div>
            </div>
            
            <!-- 賞与 -->
            <div class="bg-gray-50 p-4 rounded-lg">
                <h4 class="font-medium mb-3 text-gray-700">賞与</h4>
                <div class="space-y-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">額面</label>
                        <input 
                            type="number" 
                            name="bonus_gross" 
                            value="{% if income %}{{ income.bonus_gross.amount }}{% else %}0{% endif %}"
                            min="0"
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                        >
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">手取り</label>
                        <input 
                            type="number" 
                            name="bonus_net" 
                            value="{% if income %}{{ income.bonus_net.amount }}{% else %}0{% endif %}"
                            min="0"
                            class="w-full border border-gray-300 rounded-md px-3 py-2"
                        >
                    </div>
                </div>
            </div>
        </div>
        
        <div class="flex justify-end">
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                保存
            </button>
        </div>
    </form>
    
    {% if income %}
    <div id="income-content" class="mt-6 p-4 bg-green-50 rounded-lg">
        <p class="text-sm text-green-800">
            <strong>手取り合計:</strong> {{ "{:,}".format(income.net_total().amount) }}円
        </p>
        <p class="text-sm text-green-800">
            <strong>額面合計:</strong> {{ "{:,}".format(income.gross_total().amount) }}円
        </p>
    </div>
    {% else %}
    <div id="income-content" class="mt-6 p-4 bg-gray-50 rounded-lg">
        <p class="text-sm text-gray-600">収入データが登録されていません。</p>
    </div>
    {% endif %}
</div>
