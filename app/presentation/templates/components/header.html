<header class="bg-white shadow-md mb-6">
    <div class="container mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-800">家計簿ダッシュボード</h1>
            
            <div class="flex items-center space-x-4">
                <!-- 年選択ドロップダウン -->
                <div class="flex items-center space-x-2">
                    <label for="year-select" class="text-sm font-medium text-gray-700">年:</label>
                    <select 
                        id="year-select" 
                        name="year"
                        class="border border-gray-300 rounded-md px-3 py-1 text-sm"
                        hx-get="/dashboard/{year}"
                        hx-target="#main-content"
                        hx-trigger="change"
                        hx-swap="innerHTML"
                    >
                        {% for year in years %}
                        <option value="{{ year.value }}" {% if year.selected %}selected{% endif %}>
                            {{ year.value }}
                            {% if year.has_data %} 📊{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- グローバルナビゲーション -->
                <nav class="flex space-x-4">
                    <a href="/dashboard/{{ current_year }}" class="text-blue-600 hover:text-blue-800 font-medium">
                        年次ダッシュボード
                    </a>
                    <a href="/settings" class="text-blue-600 hover:text-blue-800 font-medium">
                        設定
                    </a>
                </nav>
            </div>
        </div>
    </div>
</header>
