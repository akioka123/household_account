version: '3.8'

services:
  db:
    image: postgres:16
    container_name: household-db
    environment:
      POSTGRES_USER: household
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: household
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U household"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: household-app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: household
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: household
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["/bin/sh", "-c", "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

volumes:
  db-data:
